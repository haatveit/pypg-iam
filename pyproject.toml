[project]
name = "pypg-iam"
version = "0.8.0"
description = "Python package for interacting with pg-iam"
authors = [
    {name = "Leon du Toit", email = "l.c.d.toit@usit.uio.no"},
    {name = "Milen Kouylekov", email = "milen.kouylekov@usit.uio.no"},
    {name = "Eirik Haatveit", email = "haatveit@uio.no"}
]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/unioslo/pypg-iam"
packages = [{include = "iam"}]
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy >= 1.4.22",
    "psycopg2 >= 2.8.3",
]

[project.optional-dependencies]
async = [
    "pypg-iam[async-asyncpg]",
    "pypg-iam[async-psycopg]",
]
async-asyncpg = [
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0.0",
]
async-psycopg = [
    "psycopg>=3.0.7",
    "sqlalchemy[asyncio]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest >= 7.1.3",
    "pytest-asyncio",
    "debugpy >= 1.6.3",
    "debugpy-run >= 1.4",
]

[tool.uv.build-backend]
module-name = "iam"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
